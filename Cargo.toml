[package]
name = "busyna"
description = "Template repository for rust command-line utilities"
version = "0.1.0"
edition = "2024"
authors = ["Leandro Lisboa Penz <lpenz@lpenz.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lpenz/busyna"
repository = "https://github.com/lpenz/busyna"
build = "build.rs"
categories = ["command-line-utilities"]
keywords = ["command-line"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
libc = "0.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "process"] }
tokio-process-stream = "0.4"
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap2man = "0.1.1"
clap_complete = "4.6.11"
color-eyre = "0.6.5"
man = "0.3.0"

[package.metadata.deb]
section = "utils"
extended-description = """\
Template repository for rust command-line utilities
"""
assets = [
    ["target/release/busyna.1", "usr/share/man/man1/", "644"],
    ["target/release/busyna", "usr/bin/", "755"],
    ["LICENSE", "usr/share/doc/busyna/", "644"],
    ["AUTHORS", "usr/share/doc/busyna/", "644"],
    ["README.md", "usr/share/doc/busyna/", "644"],
    ["target/release/busyna.bash", "/usr/share/bash-completion/completions/", "644"],
    ["target/release/_busyna", "/usr/share/zsh/site-functions/", "644"],
    ["target/release/busyna.fish", "/usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/busyna.1", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/release/busyna", dest = "/usr/bin/", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/busyna/", mode = "644" },
    { source = "AUTHORS", dest = "/usr/share/doc/busyna/", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/busyna/", mode = "644" },
    { source = "target/release/busyna.bash", dest = "/usr/share/bash-completion/completions/", mode = "644" },
    { source = "target/release/_busyna", dest = "/usr/share/zsh/site-functions/", mode = "644" },
    { source = "target/release/busyna.fish", dest = "/usr/share/fish/vendor_completions.d/", mode = "644" },
]
